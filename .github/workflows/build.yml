name: Build & Release
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis msi
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb appimage

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install deps
        run: npm ci

      - name: Validate updater signing config
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is missing. Tauri updater artifacts and latest.json cannot be generated."
            echo "Create a Tauri signing key and add TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD to GitHub Actions secrets."
            exit 1
          fi

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Generate latest.json for updater
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "=== DEBUG: bundle dir contents ==="
          ls -laR "$BUNDLE_DIR/" 2>/dev/null || echo "(bundle dir not found)"

          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Version: $VERSION, Target: ${{ matrix.target }}"

          # Map Rust target to Tauri platform key
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)   PLATFORM="windows-x86_64" ;;
            aarch64-pc-windows-msvc)  PLATFORM="windows-aarch64" ;;
            x86_64-apple-darwin)      PLATFORM="darwin-x86_64" ;;
            aarch64-apple-darwin)     PLATFORM="darwin-aarch64" ;;
            x86_64-unknown-linux-gnu) PLATFORM="linux-x86_64" ;;
            aarch64-unknown-linux-gnu) PLATFORM="linux-aarch64" ;;
            *) echo "Unknown target: ${{ matrix.target }}"; exit 1 ;;
          esac
          echo "Platform key: $PLATFORM"

          # Find the updater artifact signature generated by Tauri.
          # Windows NSIS updates use the signed .nsis.zip, not the interactive .exe installer.
          case "${{ matrix.target }}" in
            *windows*)
              SIG_FILE=$(find "$BUNDLE_DIR" -name "*.nsis.zip.sig" -type f 2>/dev/null | head -1)
              [ -z "$SIG_FILE" ] && SIG_FILE=$(find "$BUNDLE_DIR" -name "*.msi.zip.sig" -type f 2>/dev/null | head -1)
              [ -z "$SIG_FILE" ] && SIG_FILE=$(find "$BUNDLE_DIR" -name "*.msi.sig" -type f 2>/dev/null | head -1)
              ;;
            *apple*)
              SIG_FILE=$(find "$BUNDLE_DIR" -name "*.app.tar.gz.sig" -type f 2>/dev/null | head -1)
              ;;
            *linux*)
              SIG_FILE=$(find "$BUNDLE_DIR" -name "*.AppImage.tar.gz.sig" -type f 2>/dev/null | head -1)
              [ -z "$SIG_FILE" ] && SIG_FILE=$(find "$BUNDLE_DIR" -name "*.AppImage.sig" -type f 2>/dev/null | head -1)
              [ -z "$SIG_FILE" ] && SIG_FILE=$(find "$BUNDLE_DIR" -name "*.deb.sig" -type f 2>/dev/null | head -1)
              ;;
            *)
              SIG_FILE=$(find "$BUNDLE_DIR" -name "*.sig" -type f 2>/dev/null | head -1)
              ;;
          esac
          if [ -z "$SIG_FILE" ]; then
            echo "::warning::No updater .sig found for ${{ matrix.target }} - updater artifacts not generated."
            echo "Ensure TAURI_SIGNING_PRIVATE_KEY is set and createUpdaterArtifacts is enabled."
            echo "=== DEBUG: searching for .sig in entire target dir ==="
            find src-tauri/target -name "*.sig" 2>/dev/null || echo "(none found)"
            exit 1
          fi
          SIGNATURE=$(cat "$SIG_FILE")
          echo "Found signature: $SIG_FILE"

          # Derive installer file from .sig file (strip .sig suffix)
          INSTALLER_FILE="${SIG_FILE%.sig}"
          if [ ! -f "$INSTALLER_FILE" ]; then
            echo "Installer file not found at $INSTALLER_FILE (from sig: $SIG_FILE)"
            echo "=== DEBUG: listing all bundle files ==="
            find "$BUNDLE_DIR" -type f 2>/dev/null | head -30
            exit 0
          fi

          FILENAME=$(basename "$INSTALLER_FILE")
          export VERSION PLATFORM SIGNATURE FILENAME
          export PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export OUTFILE="$BUNDLE_DIR/latest.json"

          node -e "
            const fs = require('fs')
            const encodedFilename = encodeURIComponent(process.env.FILENAME)
            const manifest = {
              version: process.env.VERSION,
              notes: '',
              pub_date: process.env.PUB_DATE,
              platforms: {
                [process.env.PLATFORM]: {
                  signature: process.env.SIGNATURE,
                  url: 'https://github.com/xinbaizhe/SelfEvolvingSkills/releases/download/v' + process.env.VERSION + '/' + encodedFilename
                }
              }
            }
            fs.writeFileSync(process.env.OUTFILE, JSON.stringify(manifest, null, 2))
          "

          echo "Generated latest.json:"
          cat "$BUNDLE_DIR/latest.json"

      - name: Zip AppImage (too many files)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          for dir in appimage*/; do
            dirname=$(basename "$dir")
            zip -r "${dirname}.zip" "$dir"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/

      - name: Upload latest.json for updater
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.os }}-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/latest.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p dist
          # Windows: .exe .msi
          find release-* -name "*.exe" -o -name "*.msi" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          # macOS: .dmg + updater .app.tar.gz
          find release-* -name "*.dmg" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          find release-* -name "*.app.tar.gz" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          # Linux: .deb + AppImage zip
          find release-* -name "*.deb" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          find release-* -name "*.AppImage" -o -name "*.AppImage.tar.gz" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          find release-* -name "*.zip" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          ls -la dist/

      - name: Merge latest.json for updater
        shell: bash
        run: |
          set -e
          first=$(ls latest-json-*/latest.json 2>/dev/null | head -1)
          if [ -z "$first" ]; then
            echo "::warning::No latest.json generated by any platform. Updater manifest will not be included in this release."
            echo "Check TAURI_SIGNING_PRIVATE_KEY and per-platform build logs for .sig generation failures."
            exit 0
          fi
          cp "$first" dist/latest.json
          for f in latest-json-*/latest.json; do
            [ -f "$f" ] || continue
            jq -s '.[0] * { platforms: (.[0].platforms * .[1].platforms) }' dist/latest.json "$f" > dist/latest-tmp.json && mv dist/latest-tmp.json dist/latest.json
          done
          echo "Merged latest.json:"
          cat dist/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Release ${{ github.ref_name }}

            ### Install

            - **Windows**: download `.exe` or `.msi`
            - **macOS**: download `.dmg`
            - **Linux**: download `.deb` or `.AppImage.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
