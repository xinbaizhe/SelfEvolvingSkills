name: Build & Release
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Guards the English-default UI against regression: a hardcoded Chinese string
  # is invisible to the type checker, and a one-sided catalog only shows up as
  # untranslated text at runtime. Deliberately not a `needs:` of `release`, so a
  # cosmetic miss here cannot block shipping an urgent fix.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded Chinese
        run: bash scripts/check-i18n.sh
      - name: Check en/zh-CN key parity
        run: node scripts/check-i18n-keys.mjs
      - name: Check every t() key resolves
        run: node scripts/check-i18n-usage.mjs

  # Windows + macOS. Linux is not here: it needs `container:`, which is a
  # job-level field with no `if:`, so it cannot be conditioned per matrix entry.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis msi
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install deps
        run: npm ci

      - name: Validate updater signing config
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is missing. Tauri updater artifacts and latest.json cannot be generated."
            echo "Create a Tauri signing key and add TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD to GitHub Actions secrets."
            exit 1
          fi

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Generate latest.json for updater
        shell: bash
        run: bash ../ci/generate-latest-json.sh "${{ matrix.target }}" "${{ github.ref_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/

      - name: Upload latest.json for updater
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.os }}-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/latest.json
          if-no-files-found: warn

  # Builds inside an ubuntu:22.04 container so the artifact links against glibc
  # 2.35 instead of the ubuntu-latest runner's 2.39. Without this the AppImage
  # aborts on Ubuntu 22.04 / Debian 12 with "GLIBC_2.38 not found" and fails the
  # AppImage catalog test. ci/verify-appimage.sh asserts the ceiling still holds.
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    defaults:
      run:
        working-directory: frontend
    env:
      # linuxdeploy / linuxdeploy-plugin-appimage / appimagetool are themselves
      # AppImages, and there is no /dev/fuse inside the container - they have to
      # self-extract rather than mount. Installing libfuse2 alone does not help.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # webkit's dependency chain can pull tzdata, which otherwise blocks on an
      # interactive prompt and hangs the step.
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ubuntu:22.04 ships no git, and actions/checkout needs it on PATH -
      # otherwise it falls back to a tarball download and we end up without a
      # .git directory. This step therefore has to run before checkout, and has
      # to override the job-level working-directory: frontend/ does not exist
      # until checkout has run. The container is root and has no sudo, and the
      # bind-mounted workspace is owned by the runner's uid, which trips git's
      # dubious-ownership guard.
      - name: Bootstrap toolchain prerequisites
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl wget file xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux deps
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            build-essential \
            zip \
            libfuse2 \
            binutils

      - name: Install deps
        run: npm ci

      - name: Validate updater signing config
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is missing. Tauri updater artifacts and latest.json cannot be generated."
            echo "Create a Tauri signing key and add TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD to GitHub Actions secrets."
            exit 1
          fi

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles deb appimage

      - name: Generate latest.json for updater
        shell: bash
        run: bash ../ci/generate-latest-json.sh "x86_64-unknown-linux-gnu" "${{ github.ref_name }}"

      - name: Zip AppImage (too many files)
        shell: bash
        run: |
          cd src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          for dir in appimage*/; do
            dirname=$(basename "$dir")
            zip -r "${dirname}.zip" "$dir"
          done

      # Guards two separate regressions: a tauri-bundler downgrade re-introducing
      # absolute .DirIcon symlinks (tauri-apps/tauri#15596, fixed in tauri-cli
      # 2.11.4 / tauri-bundler 2.9.4), and the build image drifting back to a
      # glibc newer than 2.35. Both are only visible on someone else's machine.
      - name: Verify AppImage
        shell: bash
        run: |
          APPIMAGE=$(find "src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -type f | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No .AppImage produced"
            exit 1
          fi
          bash ../ci/verify-appimage.sh "$APPIMAGE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu-2204-x86_64-unknown-linux-gnu
          path: frontend/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/

      - name: Upload latest.json for updater
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-ubuntu-2204-x86_64-unknown-linux-gnu
          path: frontend/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/latest.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      # Checkout must come first. It runs with `clean: true`, which deletes
      # untracked files - placed after the merge step below it wiped
      # `dist/latest.json` before the commit-back could see it, so that step was
      # skipped on every release and master's latest.json stayed stale.
      - uses: actions/checkout@v4
        with:
          ref: master
          # Full history: committing on top of a shallow clone can be rejected.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p dist
          # Windows: .exe .msi + updater .nsis.zip / .msi.zip
          find release-* \( -name "*.exe" -o -name "*.msi" -o -name "*.nsis.zip" -o -name "*.msi.zip" \) | while read f; do
            name=$(basename "$f")
            cp "$f" "dist/${name// /.}"
          done
          # macOS: .dmg + updater .app.tar.gz
          find release-* \( -name "*.dmg" -o -name "*.app.tar.gz" \) | while read f; do
            name=$(basename "$f")
            cp "$f" "dist/${name// /.}"
          done
          # Linux: .deb + AppImage zip
          find release-* \( -name "*.deb" -o -name "*.AppImage" -o -name "*.AppImage.tar.gz" \) | while read f; do
            name=$(basename "$f")
            cp "$f" "dist/${name// /.}"
          done
          find release-* -name "*.zip" | while read f; do
            name=$(basename "$f")
            cp "$f" "dist/${name// /.}"
          done
          ls -la dist/

      - name: Merge latest.json for updater
        shell: bash
        run: |
          set -e
          first=$(ls latest-json-*/latest.json 2>/dev/null | head -1)
          if [ -z "$first" ]; then
            echo "::warning::No latest.json generated by any platform. Updater manifest will not be included in this release."
            echo "Check TAURI_SIGNING_PRIVATE_KEY and per-platform build logs for .sig generation failures."
            exit 0
          fi
          cp "$first" dist/latest.json
          for f in latest-json-*/latest.json; do
            [ -f "$f" ] || continue
            jq -s '.[0] * { platforms: (.[0].platforms * .[1].platforms) }' dist/latest.json "$f" > dist/latest-tmp.json && mv dist/latest-tmp.json dist/latest.json
          done
          echo "Merged latest.json:"
          cat dist/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Release ${{ github.ref_name }}

            ### Install

            - **Windows**: download `.exe` or `.msi`
            - **macOS**: download `.dmg`
            - **Linux**: download `.deb` or `.AppImage.zip`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit latest.json to repo (for jsDelivr mirror)
        shell: bash
        run: |
          # Checked here rather than in an `if:` so the skip is visible in the
          # log with a reason, instead of the step silently not running.
          if [ ! -f dist/latest.json ]; then
            echo "::warning::dist/latest.json was not produced - skipping the repo commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp dist/latest.json latest.json
          if git diff --quiet latest.json; then
            echo "latest.json unchanged, skip commit"
          else
            git add latest.json
            git commit -m "chore: update latest.json for ${{ github.ref_name }} [skip ci]"
            git push origin master
            echo "::notice::latest.json updated and pushed to master branch"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
