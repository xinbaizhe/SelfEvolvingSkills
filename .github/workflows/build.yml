name: Build & Release
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis msi
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb appimage

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install deps
        run: npm ci

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Generate latest.json for updater
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"

          # Map Rust target → Tauri platform key
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)   PLATFORM="windows-x86_64" ;;
            aarch64-pc-windows-msvc)  PLATFORM="windows-aarch64" ;;
            x86_64-apple-darwin)      PLATFORM="darwin-x86_64" ;;
            aarch64-apple-darwin)     PLATFORM="darwin-aarch64" ;;
            x86_64-unknown-linux-gnu) PLATFORM="linux-x86_64" ;;
            aarch64-unknown-linux-gnu) PLATFORM="linux-aarch64" ;;
            *) echo "Unknown target: ${{ matrix.target }}"; exit 1 ;;
          esac

          # Find .sig file (generated by tauri build when signing key is available)
          SIG_FILE=$(find "$BUNDLE_DIR" -name "*.sig" -type f 2>/dev/null | head -1)
          if [ -z "$SIG_FILE" ]; then
            echo "No .sig file found — updater artifacts not generated (missing/invalid signing key?)"
            exit 0
          fi
          SIGNATURE=$(cat "$SIG_FILE")
          echo "Found signature: $SIG_FILE"

          # Find the updater bundle file (zip/tarball)
          case "${{ matrix.target }}" in
            *windows*)
              ZIP_FILE=$(find "$BUNDLE_DIR" -name "*.nsis.zip" -type f 2>/dev/null | head -1)
              [ -z "$ZIP_FILE" ] && ZIP_FILE=$(find "$BUNDLE_DIR" -name "*.msi.zip" -type f 2>/dev/null | head -1)
              ;;
            *apple*)
              ZIP_FILE=$(find "$BUNDLE_DIR" -name "*.app.tar.gz" -type f 2>/dev/null | head -1)
              ;;
            *linux*)
              ZIP_FILE=$(find "$BUNDLE_DIR" -name "*.AppImage.tar.gz" -type f 2>/dev/null | head -1)
              ;;
          esac

          if [ -z "$ZIP_FILE" ]; then
            echo "No updater bundle found — skipping latest.json"
            exit 0
          fi

          FILENAME=$(basename "$ZIP_FILE")
          export VERSION PLATFORM SIGNATURE
          export URL="https://github.com/xinbaizhe/SelfEvolvingSkills/releases/download/v${VERSION}/${FILENAME}"
          export PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export OUTFILE="$BUNDLE_DIR/latest.json"

          node -e "
            const fs = require('fs')
            const manifest = {
              version: process.env.VERSION,
              notes: '',
              pub_date: process.env.PUB_DATE,
              platforms: {
                [process.env.PLATFORM]: {
                  signature: process.env.SIGNATURE,
                  url: process.env.URL
                }
              }
            }
            fs.writeFileSync(process.env.OUTFILE, JSON.stringify(manifest, null, 2))
          "

          echo "Generated latest.json:"
          cat "$BUNDLE_DIR/latest.json"

      - name: Zip AppImage (too many files)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle
          for dir in appimage*/; do
            dirname=$(basename "$dir")
            zip -r "${dirname}.zip" "$dir"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/

      - name: Upload latest.json for updater
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.os }}-${{ matrix.target }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/latest.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p dist
          # Windows: .exe .msi
          find release-* -name "*.exe" -o -name "*.msi" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          # macOS: .dmg + updater .app.tar.gz
          find release-* -name "*.dmg" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          find release-* -name "*.app.tar.gz" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          # Linux: .deb + AppImage zip
          find release-* -name "*.deb" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          find release-* -name "*.AppImage" -o -name "*.AppImage.tar.gz" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          find release-* -name "*.zip" | while read f; do
            cp "$f" "dist/$(basename "$f")"
          done
          ls -la dist/

      - name: Merge latest.json for updater
        shell: bash
        run: |
          set +e
          first=$(ls latest-json-*/latest.json 2>/dev/null | head -1)
          if [ -z "$first" ]; then
            echo "No latest.json artifacts found — skipping updater manifest"
            exit 0
          fi
          cp "$first" dist/latest.json
          for f in latest-json-*/latest.json; do
            [ -f "$f" ] || continue
            jq -s '.[0] * { platforms: (.[0].platforms * .[1].platforms) }' dist/latest.json "$f" > dist/latest-tmp.json && mv dist/latest-tmp.json dist/latest.json
          done
          echo "Merged latest.json:"
          cat dist/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Release ${{ github.ref_name }}

            ### 安装

            - **Windows**: 下载 `.exe` 或 `.msi`
            - **macOS**: 下载 `.dmg`
            - **Linux**: 下载 `.deb` 或 `.AppImage.zip`（解压后运行）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
